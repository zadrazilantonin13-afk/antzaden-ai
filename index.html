/* ==========================================
   API
========================================== */

async function api(action, extra = {}, useToken = true) {
  const headers = { "Content-Type": "application/json" };

  if (useToken && token) {
    headers.Authorization = "Bearer " + token;
  }

  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers,
    body: JSON.stringify({
      action,
      ...(useToken && token ? { token } : {}),
      ...extra
    })
  });

  const raw = await response.text();
  let data;

  try {
    data = JSON.parse(raw);
  } catch {
    throw new Error("Server vrátil neplatnou odpověď: " + raw.slice(0, 180));
  }

  if (!response.ok) {
    throw new Error(data.error || "Chyba serveru " + response.status);
  }

  if (data.error) {
    throw new Error(data.error);
  }

  return data;
}

/* ==========================================
   MARKDOWN
========================================== */

function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function inlineMarkdown(text) {
  let html = escapeHTML(text);

  html = html.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
  );

  return html
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
}

function renderMarkdown(text) {
  const lines = String(text).split("\n");
  let html = "";
  let paragraph = [];
  let list = "";
  let code = false;
  let codeLines = [];

  function flush() {
    if (paragraph.length) {
      html += "<p>" + paragraph.map(inlineMarkdown).join("<br>") + "</p>";
      paragraph = [];
    }
  }

  function closeList() {
    if (list) {
      html += list === "ul" ? "</ul>" : "</ol>";
      list = "";
    }
  }

  for (const line of lines) {
    if (line.trim().startsWith("```")) {
      flush();
      closeList();

      if (code) {
        html += "<pre><code>" +
          escapeHTML(codeLines.join("\n")) +
          "</code></pre>";
        codeLines = [];
        code = false;
      } else {
        code = true;
      }
      continue;
    }

    if (code) {
      codeLines.push(line);
      continue;
    }

    let match = line.match(/^(#{1,3})\s+(.+)$/);

    if (match) {
      flush();
      closeList();
      const n = match[1].length;
      html += `<h${n}>${inlineMarkdown(match[2])}</h${n}>`;
      continue;
    }

    match = line.match(/^\s*[-*]\s+(.+)$/);
    const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);

    if (match || numbered) {
      flush();
      const type = match ? "ul" : "ol";

      if (list !== type) {
        closeList();
        html += type === "ul" ? "<ul>" : "<ol>";
        list = type;
      }

      html += "<li>" + inlineMarkdown((match || numbered)[1]) + "</li>";
      continue;
    }

    match = line.match(/^\s*>\s?(.*)$/);

    if (match) {
      flush();
      closeList();
      html += "<blockquote>" + inlineMarkdown(match[1]) + "</blockquote>";
      continue;
    }

    if (!line.trim()) {
      flush();
      closeList();
      continue;
    }

    closeList();
    paragraph.push(line);
  }

  if (code) {
    html += "<pre><code>" +
      escapeHTML(codeLines.join("\n")) +
      "</code></pre>";
  }

  flush();
  closeList();

  return html;
}

function clearChatView() {
  $("chat").innerHTML = "";

  const indicator = document.createElement("div");
  indicator.id = "typing";
  indicator.innerHTML =
    '<span class="spinner"></span>AntZadEn AI přemýšlí…';

  $("chat").appendChild(indicator);
}

function addMessage(text, isUser = false) {
  const box = document.createElement("div");
  box.className = "message " + (isUser ? "user" : "bot");

  if (!isUser) {
    const name = document.createElement("div");
    name.className = "botname";
    name.textContent = "ANTZADEN AI";
    box.appendChild(name);
  }

  const content = document.createElement("div");

  if (isUser) {
    content.textContent = text;
  } else {
    content.className = "markdown";
    content.innerHTML = renderMarkdown(text);
  }

  box.appendChild(content);

  const typing = $("typing");
  if (typing && typing.parentNode === $("chat")) {
    $("chat").insertBefore(box, typing);
  } else {
    $("chat").appendChild(box);
  }

  scrollDown();
  return content;
}

function scrollDown() {
  $("chat").scrollTop = $("chat").scrollHeight;
}

async function typeAnswer(element, text) {
  const chars = Array.from(String(text));
  element.textContent = "";

  for (let i = 0; i < chars.length; i += 4) {
    element.textContent = chars.slice(0, i + 4).join("");
    scrollDown();
    await new Promise(resolve => setTimeout(resolve, 8));
  }

  element.innerHTML = renderMarkdown(text);
  scrollDown();
}

function makeChatRow(item) {
  const row = document.createElement("div");
  row.className = "chat-item";

  const button = document.createElement("button");
  button.className =
    "chat-select" + (item.id === currentChatId ? " active" : "");
  button.textContent = item.title || "Nový chat";
  button.title = item.title || "Nový chat";
  button.onclick = () => openChat(item.id);

  const rename = document.createElement("button");
  rename.className = "chat-rename";
  rename.textContent = "✎";
  rename.title = "Přejmenovat chat";

  rename.onclick = async () => {
    const newTitle = prompt(
      "Zadej nový název chatu:",
      item.title || "Nový chat"
    );

    if (newTitle === null) return;

    const title = newTitle.trim();

    if (!title) {
      alert("Název chatu nesmí být prázdný.");
      return;
    }

    try {
      await api("chat-rename", {
        chatId: item.id,
        title: title.slice(0, 100)
      });

      await loadChatsListOnly();
    } catch (error) {
      alert("Chat se nepodařilo přejmenovat: " + error.message);
    }
  };

  const del = document.createElement("button");
  del.className = "chat-delete";
  del.textContent = "×";
  del.title = "Smazat chat";

  del.onclick = async () => {
    if (!confirm("Opravdu chceš tento chat smazat?")) return;

    try {
      await api("chat-delete", { chatId: item.id });

      if (currentChatId === item.id) {
        currentChatId = null;
      }

      await loadChats();
    } catch (error) {
      alert("Chat se nepodařilo smazat: " + error.message);
    }
  };

  row.append(button, rename, del);
  return row;
}

async function loadChatsListOnly() {
  const data = await api("chats-list");
  const list = $("chat-list");

  list.innerHTML = "";

  (data.chats || []).forEach(item => {
    list.appendChild(makeChatRow(item));

    p.className = "sub";
    p.textContent = "Zatím nemáš žádné chaty.";
    list.appendChild(p);
  }
}

async function loadChats() {

  list.innerHTML = "<div class='sub'>Načítám chaty...</div>";

  try {
    const data = await api("chats-list");
    list.innerHTML = "";

    (data.chats || []).forEach(item => {
      list.appendChild(makeChatRow(item));
    });

    if (data.chats?.length) {
      if (
        !currentChatId ||
        !data.chats.some(item => item.id === currentChatId)
      ) {
        await openChat(data.chats[0].id);
      }
    } else {
      await createChat();
    }

  } catch (error) {
    list.textContent = "Chyba: " + error.message;
    clearChatView();
    addMessage("Nepodařilo se načíst chaty: " + error.message, false);
  }
}

async function createChat() {

    if (!data.chat?.id) {

    await loadChatsListOnly();

  } catch (error) {
    clearChatView();
    addMessage("Nepodařilo se vytvořit chat: " + error.message, false);
  }
}

async function openChat(chatId) {
  currentChatId = chatId;
  clearChatView();

  try {
    const data = await api("chat-get", { chatId });
    clearChatView();

    if (!data.messages?.length) {
      addMessage(
        "Ahoj! 👋 Jsem **AntZadEn AI Assistant**. Zeptej se mě na cokoliv!",
        false
      );
    } else {
      data.messages.forEach(message => {
        addMessage(message.content, message.role === "user");
      });
    }

    await loadChatsListOnly();
    scrollDown();

  } catch (error) {
    addMessage("Nepodařilo se načíst chat: " + error.message, false);
  }
}

function weatherDescription(code) {
  return ({
    0: "jasno",
    1: "převážně jasno",

    3: "zataženo",
    45: "mlha",

    95: "bouřky",
    96: "bouřky s kroupami",
    99: "silné bouřky"
  })[code] || "proměnlivé počasí";
}

async function getDeviceLocation() {
  if (navigator.geolocation) {
    try {
      const position = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          timeout: 6500,
          maximumAge: 300000
        });
      });

      return {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        name: "Poloha zařízení"
      };
    } catch (error) {
      console.warn("GPS nedostupná:", error);
    }
  }

  try {
    const response = await fetch("https://ipapi.co/json/");
    if (!response.ok) throw new Error("Poloha IP není dostupná.");

    const data = await response.json();

    if (data.latitude != null && data.longitude != null) {
      return {
        latitude: data.latitude,
        longitude: data.longitude,
        name: data.city || "Přibližná poloha"
      };
    }
  } catch (error) {
    console.warn(error);
  }

  const city = prompt("Poloha není dostupná. Zadej město:");
  if (!city) throw new Error("Nebyla zadána poloha.");

  const response = await fetch(
    "https://geocoding-api.open-meteo.com/v1/search?name=" +
    encodeURIComponent(city) +
    "&count=1&language=cs&format=json"
  );

  const data = await response.json();

  if (!data.results?.length) {
    throw new Error("Město nebylo nalezeno.");
  }

  return {
    latitude: data.results[0].latitude,
    longitude: data.results[0].longitude,
    name: data.results[0].name
  };
}

async function getWeather(query) {
  const location = await getDeviceLocation();
  const date = new Date();
  date.setHours(0, 0, 0, 0);

  const q = query.toLowerCase();

  if (q.includes("pozítří")) {
    date.setDate(date.getDate() + 2);
  } else if (q.includes("zítra")) {
    date.setDate(date.getDate() + 1);
  }

  const days = Math.round(
    (date - new Date(new Date().setHours(0, 0, 0, 0))) / 86400000
  );

  if (days < 0 || days > 15) {
    return "Předpověď pro tento den zatím není dostupná.";
  }

  const iso =
    date.getFullYear() + "-" +
    String(date.getMonth() + 1).padStart(2, "0") + "-" +
    String(date.getDate()).padStart(2, "0");

  const params = new URLSearchParams({
    latitude: location.latitude,
    longitude: location.longitude,
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
    timezone: "auto",
    forecast_days: "16"
  });

  const response = await fetch(
    "https://api.open-meteo.com/v1/forecast?" + params
  );

  if (!response.ok) {
    throw new Error("Počasí se nepodařilo načíst.");
  }

  const data = await response.json();
  const index = data.daily.time.indexOf(iso);

  if (index < 0) return "Předpověď není dostupná.";

  return `## 🌤️ Počasí

**📍 Místo:** ${location.name}
**📅 ${date.toLocaleDateString("cs-CZ", {
    weekday: "long",
    day: "numeric",
    month: "long"
  })}**

- 🌡️ Teplota: **${data.daily.temperature_2m_min[index]} až ${data.daily.temperature_2m_max[index]} °C**
- ☁️ Počasí: **${weatherDescription(data.daily.weather_code[index])}**
- 🌧️ Pravděpodobnost srážek: **${data.daily.precipitation_probability_max[index] ?? "neznámá"} %**

*Předpověď se může změnit.*`;
}

async function getLocalAnswer(query) {
  const q = query.toLowerCase();

  if (q.includes("kolik je hodin")) {
    return "Právě je **" +
      new Date().toLocaleTimeString("cs-CZ", {
        hour: "2-digit",
        minute: "2-digit"
      }) +
      "** podle času tvého zařízení.";
  }

  if (
    q.includes("počasí") ||
    q.includes("předpověď") ||
    q.includes("teplota")
  ) {
    return await getWeather(query);
  }

  return null;
}

/* ==========================================
   HLAS PRO BĚŽNÉ TEXTOVÉ ODPOVĚDI
   Oprava chybějící funkce speakAnswer().
   LIVE má vlastní hlasový výstup.
========================================== */

let browserSpeechEnabled = false;

function speakAnswer(text) {
  if (liveActive || !browserSpeechEnabled) return;
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(
    String(text).replace(/[#*_`]/g, " ")
  );

  utterance.lang = "cs-CZ";
  utterance.rate = 1;
  utterance.pitch = 0.9;

  const voices = window.speechSynthesis.getVoices();
  const czechVoice = voices.find(v =>
    v.lang.toLowerCase().startsWith("cs")
  );

  if (czechVoice) utterance.voice = czechVoice;

  window.speechSynthesis.speak(utterance);
}

/* ==========================================
   ODESÍLÁNÍ TEXTOVÝCH ZPRÁV
========================================== */

async function sendMessage(query) {
  if (busy || !query.trim()) return;

  if (!currentChatId) {
    await createChat();
    if (!currentChatId) return;
  }

  busy = true;
  $("send").disabled = true;
  $("input").disabled = true;

  addMessage(query, true);
  $("typing").style.display = "flex";
  scrollDown();

  try {
    let answer = await getLocalAnswer(query);

    if (answer !== null) {
      await api("chat-save-message", {
        chatId: currentChatId,
        role: "user",
        content: query
      });

      await api("chat-save-message", {
        chatId: currentChatId,
        role: "assistant",
        content: answer
      });

    } else {
      const data = await api("chat-send", {
        chatId: currentChatId,
        message: query
      });

      answer = data.reply;
    }

    if (!answer) {
      throw new Error("Server nevrátil text odpovědi.");
    }

    $("typing").style.display = "none";
    const target = addMessage("", false);

    await typeAnswer(target, answer);
    speakAnswer(answer);
    await loadChatsListOnly();

  } catch (error) {
    $("typing").style.display = "none";
    addMessage(
      "Nepodařilo se získat odpověď.\n\n" + error.message,
      false
    );
    console.error("Chat:", error);

  } finally {
    busy = false;
    $("send").disabled = false;
    $("input").disabled = false;
    $("input").focus();
    scrollDown();
  }
}

$("form").addEventListener("submit", event => {
  event.preventDefault();

  const value = $("input").value.trim();

  if (value) {
    $("input").value = "";
    sendMessage(value);
  }
});

document.querySelectorAll(".quick button").forEach(button => {
  button.onclick = () => {
    $("input").value = button.dataset.question;
    $("form").requestSubmit();
  };
});

/* ==========================================
   GEMINI LIVE – HLASOVÝ REŽIM
========================================== */

let liveSocket = null;
let liveStream = null;
let liveAudioContext = null;
let liveProcessor = null;
let liveSource = null;
let liveMute = null;

let liveActive = false;
let liveReady = false;
let liveOutputEnabled = true;
let liveNextPlayTime = 0;
let liveSources = [];

let liveUserTranscript = "";
let liveAssistantTranscript = "";

const liveMic = $("voice-mic");
const liveToggle = $("voice-toggle");
const liveStatus = $("voice-status");

function liveStatusText(text) {
  liveStatus.textContent = text;
}

function liveBase64(bytes) {
  let binary = "";
  const chunk = 0x8000;

  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode(
      ...bytes.subarray(i, i + chunk)
    );
  }

  return btoa(binary);
}

function liveResample(inputData, fromRate, toRate) {
  if (fromRate === toRate) return inputData;

  const ratio = fromRate / toRate;
  const length = Math.floor(inputData.length / ratio);
  const output = new Float32Array(length);

  for (let i = 0; i < length; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(
      Math.floor((i + 1) * ratio),
      inputData.length
    );

    let sum = 0;

    for (let j = start; j < end; j++) {
      sum += inputData[j];
    }

    output[i] = sum / Math.max(1, end - start);
  }

  return output;
}

function liveStopPlayback() {
  liveSources.forEach(source => {
    try {
      source.stop();
    } catch {}
  });

  liveSources = [];

  if (liveAudioContext) {
    liveNextPlayTime = liveAudioContext.currentTime;
  }
}

function livePlayAudio(base64) {
  if (!liveOutputEnabled || !liveAudioContext) return;

  try {
    const binary = atob(base64);
    const samples = new Int16Array(binary.length / 2);

    for (let i = 0; i < samples.length; i++) {
      const lo = binary.charCodeAt(i * 2);
      const hi = binary.charCodeAt(i * 2 + 1);

      let value = (hi << 8) | lo;
      if (value >= 32768) value -= 65536;

      samples[i] = value;
    }

    const buffer = liveAudioContext.createBuffer(
      1,
      samples.length,
      24000
    );

    const channel = buffer.getChannelData(0);

    for (let i = 0; i < samples.length; i++) {
      channel[i] = samples[i] / 32768;
    }

    const source = liveAudioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(liveAudioContext.destination);

    const startAt = Math.max(
      liveAudioContext.currentTime,
      liveNextPlayTime
    );

    source.start(startAt);
    liveNextPlayTime = startAt + buffer.duration;

    liveSources.push(source);

    source.onended = () => {
      liveSources = liveSources.filter(x => x !== source);
    };

  } catch (error) {
    console.error("Přehrání LIVE audia:", error);
  }
}

function liveSendAudio(floatData) {
  if (
    !liveSocket ||
    liveSocket.readyState !== WebSocket.OPEN ||
    !liveReady ||
    !liveAudioContext
  ) {
    return;
  }

  const resampled = liveResample(
    floatData,
    liveAudioContext.sampleRate,
    16000
  );

  const pcm = new Int16Array(resampled.length);

  for (let i = 0; i < resampled.length; i++) {
    const sample = Math.max(-1, Math.min(1, resampled[i]));

    pcm[i] = sample < 0
      ? sample * 32768
      : sample * 32767;
  }

  liveSocket.send(JSON.stringify({
    realtimeInput: {
      audio: {
        data: liveBase64(
          new Uint8Array(
            pcm.buffer,
            pcm.byteOffset,
            pcm.byteLength
          )
        ),
        mimeType: "audio/pcm;rate=16000"
      }
    }
  }));
}

async function liveStartMicrophone() {
  liveStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  });

  liveAudioContext = new AudioContext();
  await liveAudioContext.resume();

  liveSource = liveAudioContext.createMediaStreamSource(liveStream);

  liveProcessor = liveAudioContext.createScriptProcessor(
    4096,
    1,
    1
  );

  liveProcessor.onaudioprocess = event => {
    if (!liveActive || !liveReady) return;

    const data = event.inputBuffer.getChannelData(0);
    liveSendAudio(new Float32Array(data));
  };

  liveMute = liveAudioContext.createGain();
  liveMute.gain.value = 0;

  liveSource.connect(liveProcessor);
  liveProcessor.connect(liveMute);
  liveMute.connect(liveAudioContext.destination);
}

async function startLiveVoice() {
  if (liveActive) return;

  if (!navigator.mediaDevices?.getUserMedia) {
    liveStatusText("Mikrofon vyžaduje HTTPS.");
    return;
  }

  liveActive = true;
  liveReady = false;
  liveUserTranscript = "";
  liveAssistantTranscript = "";

  liveMic.textContent = "⏹ Ukončit LIVE";
  liveStatusText("Povoluji mikrofon…");

  try {
    // Mikrofon spustíme před připojením, aby se chyba
    // oprávnění nezasekla až po připojení k serveru.
    await liveStartMicrophone();

    liveStatusText("Získávám bezpečný LIVE token…");

    const tokenData = await api("live-token");

    if (!tokenData.token) {
      throw new Error("Server nevydal hlasový token.");
    }

    const url =
      "wss://generativelanguage.googleapis.com/ws/" +
      "google.ai.generativelanguage.v1beta.GenerativeService." +
      "BidiGenerateContentConstrained?access_token=" +
      encodeURIComponent(tokenData.token);

    liveSocket = new WebSocket(url);

    liveSocket.onopen = () => {
      if (!liveActive || !liveSocket) return;

      liveStatusText("Nastavuji AntZadEn LIVE…");

      liveSocket.send(JSON.stringify({
        setup: {
          model: "models/gemini-3.1-flash-live-preview",

          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: "Charon"
                }
              }
            }
          },

          systemInstruction: {
            parts: [{
              text:
                "Jsi AntZadEn AI Assistant. " +
                "Mluv přirozeně a přátelsky česky. " +
                "Jsi hlasový asistent. " +
                "Odpovídej jasně, srozumitelně a přirozeně. " +
                "Neodpovídej zbytečně dlouze. " +
                "Pokud uživatel mluví česky, odpovídej česky."
            }]
          },

          inputAudioTranscription: {},
          outputAudioTranscription: {}
        }
      }));
    };

    liveSocket.onmessage = async event => {
      if (!liveActive) return;

      try {
        const data = JSON.parse(event.data);

        if (data.error) {
          throw new Error(
            data.error.message || "Chyba Gemini LIVE."
          );
        }

        if (data.setupComplete) {
          liveReady = true;
          liveStatusText("🟢 LIVE – můžeš mluvit");
          return;
        }

        const content = data.serverContent;
        if (!content) return;

        if (content.inputTranscription?.text) {
          liveUserTranscript += content.inputTranscription.text;
        }

        if (content.outputTranscription?.text) {
          liveAssistantTranscript += content.outputTranscription.text;
        }

        if (content.interrupted) {
          liveStopPlayback();
        }

        const parts = content.modelTurn?.parts || [];

        for (const part of parts) {
          if (
            part.inlineData?.data &&
            part.inlineData.mimeType?.startsWith("audio/")
          ) {
            livePlayAudio(part.inlineData.data);
          }
        }

        if (content.turnComplete) {
          const userText = liveUserTranscript.trim();
          const assistantText = liveAssistantTranscript.trim();

          liveUserTranscript = "";
          liveAssistantTranscript = "";

          if (userText) {
            addMessage(userText, true);

            saveLocalMessage("user", userText).catch(error => {
              console.error("Uložení hlasové otázky:", error);
            });
          }

          if (assistantText) {
            addMessage(assistantText, false);

            saveLocalMessage("assistant", assistantText).catch(error => {
              console.error("Uložení hlasové odpovědi:", error);
            });
          }

          liveStatusText("🟢 LIVE – poslouchám");
        }

      } catch (error) {
        console.error("Zpráva LIVE:", error);
        liveStatusText("Chyba LIVE: " + error.message);
      }
    };

    liveSocket.onerror = () => {
      liveStatusText("Chyba LIVE spojení. Zkontroluj token a Worker.");
    };

    liveSocket.onclose = event => {
      if (!liveActive) return;

      const reason = event.reason || "Spojení bylo ukončeno.";
      stopLiveVoice();
      liveStatusText("LIVE ukončeno: " + reason);
    };

  } catch (error) {
    console.error("AntZadEn LIVE:", error);
    await stopLiveVoice();
    liveStatusText("Chyba LIVE: " + error.message);
  }
}

async function stopLiveVoice() {
  liveActive = false;
  liveReady = false;

  liveStopPlayback();

  const socket = liveSocket;
  liveSocket = null;

  if (socket) {
    socket.onclose = null;
    socket.onerror = null;
    socket.onmessage = null;

    if (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    ) {
      try {
        socket.close();
      } catch {}
    }
  }

  if (liveProcessor) {
    liveProcessor.onaudioprocess = null;
    try {
      liveProcessor.disconnect();
    } catch {}
    liveProcessor = null;
  }

  if (liveSource) {
    try {
      liveSource.disconnect();
    } catch {}
    liveSource = null;
  }

  if (liveMute) {
    try {
      liveMute.disconnect();
    } catch {}
    liveMute = null;
  }

  if (liveStream) {
    liveStream.getTracks().forEach(track => track.stop());
    liveStream = null;
  }

  if (liveAudioContext) {
    const context = liveAudioContext;
    liveAudioContext = null;
    await context.close().catch(() => {});
  }

  liveMic.textContent = "🎤 Spustit LIVE";
}

liveMic.onclick = () => {
  if (liveActive) {
    stopLiveVoice();
    liveStatusText("LIVE vypnuto.");
  } else {
    startLiveVoice();
  }
};

liveToggle.onclick = () => {
  liveOutputEnabled = !liveOutputEnabled;

  liveToggle.textContent = liveOutputEnabled
    ? "🔊 Hlas: zapnutý"
    : "🔇 Hlas: vypnutý";

  browserSpeechEnabled = liveOutputEnabled;

  if (!liveOutputEnabled) {
    liveStopPlayback();

    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  }
};

========================================== */

async function checkConnection() {
  try {
    const response = await fetch(WORKER_URL, {
      cache: "no-store"
    });

    const data = await response.json();

    const online =
      data.status === "online" &&
      data.ai &&
      data.database;

    $("connection-status").textContent = online
      ? "● AI ONLINE"
      : "● ČÁSTEČNĚ ONLINE";

    $("connection-status").style.color =
      online ? "#55e879" : "#ff7777";

  } catch {
    $("connection-status").textContent = "● OFFLINE";
    $("connection-status").style.color = "#ff7777";
  }
}

/* ==========================================
   ADMINISTRACE
========================================== */

async function adminRequest(action, extra = {}) {
  const headers = { "Content-Type": "application/json" };

  if (adminToken) {
    headers.Authorization = "Bearer " + adminToken;
  }

  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers,
    body: JSON.stringify({ action, ...extra })
  });

  const raw = await response.text();
  let data;

  try {
    data = JSON.parse(raw);
  } catch {
    throw new Error("Server administrace vrátil neplatnou odpověď.");
  }

  if (!response.ok) {
    throw new Error(data.error || "Chyba administrace.");
  }

  return data;
}

function showAdmin() {
  $("app").style.display = "none";
  $("admin-screen").style.display = "block";
  checkAdminSession();
}

function hideAdmin() {
  $("admin-screen").style.display = "none";
  $("app").style.display = "block";
}

async function checkAdminSession() {
  if (!adminToken) {
    $("admin-login").style.display = "block";
    $("admin-dashboard").style.display = "none";
    return;
  }

  try {
    await adminRequest("admin-check");

    $("admin-login").style.display = "none";
    $("admin-dashboard").style.display = "block";

    await refreshAdminStatus();

  } catch {
    adminToken = "";
    sessionStorage.removeItem("antzaden_admin_token");

    $("admin-login").style.display = "block";
    $("admin-dashboard").style.display = "none";
  }
}

$("admin-login-button").onclick = async () => {
  $("admin-error").textContent = "Ověřuji...";

  try {
    const data = await adminRequest("admin-login", {
      password: $("admin-password").value
    });

    if (!data.token) {
      throw new Error("Server nevrátil administrační token.");
    }

    adminToken = data.token;
    sessionStorage.setItem("antzaden_admin_token", adminToken);

    $("admin-password").value = "";
    $("admin-error").textContent = "";

    await checkAdminSession();

  } catch (error) {
    $("admin-error").textContent = error.message;
  }
};

async function refreshAdminStatus() {
  try {
    const response = await fetch(WORKER_URL, {
      cache: "no-store"
    });

    const data = await response.json();

    $("admin-ai-status").textContent =
      data.ai ? "🟢 Online" : "🔴 Offline";

    $("admin-search-status").textContent =
      data.search ? "🟢 Aktivní" : "🔴 Neaktivní";

    $("admin-db-status").textContent =
      data.database ? "🟢 Připojena" : "🔴 Nepřipojena";

  } catch {
    $("admin-ai-status").textContent = "🔴 Nedostupná";
    $("admin-search-status").textContent = "🔴 Nedostupné";
    $("admin-db-status").textContent = "🔴 Nedostupná";
  }
}

$("admin-refresh").onclick = refreshAdminStatus;

$("admin-logout").onclick = () => {
  adminToken = "";
  sessionStorage.removeItem("antzaden_admin_token");

  $("admin-dashboard").style.display = "none";
  $("admin-login").style.display = "block";
  $("admin-error").textContent = "Byl jsi odhlášen.";
};

$("admin-open").onclick = () => {
  location.hash = "admin";
};

$("admin-back").onclick = () => {
  history.replaceState(
    null,
    "",
    location.pathname + location.search
  );

  hideAdmin();
};

function handleRoute() {
  if (location.hash === "#admin") {
    showAdmin();
  } else if ($("admin-screen").style.display === "block") {
    hideAdmin();
  }
}

window.addEventListener("hashchange", handleRoute);

========================================== */

console.log("AntZadEn AI Assistant – Guest Mode.");

initializeGuest();
setInterval(checkConnection, 30000);
handleRoute();
